<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <title>Bomberman Arena</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="home">
        <header class="home-header">
          <div class="wordmark"><span class="wordmark-bomb" aria-hidden="true"></span>Bomberman Arena</div>
        </header>

        <div class="home-content">
          <div class="home-copy">
            <h1>Bienvenue dans<br />l'arène !</h1>
            <form id="connection-form" class="connection-form" data-state="disconnected">
              <label for="server-address">Adresse du serveur</label>
              <input id="server-address" name="server-address" type="url"
                value="http://localhost:3000" placeholder="http://localhost:3000"
                required spellcheck="false" autocomplete="off" aria-describedby="server-hint" />
              <p id="server-hint" class="server-hint">Sur le même ordinateur, garde l’adresse proposée.</p>
              <div class="connection-actions">
                <button id="connect-button" type="submit">Se connecter</button>
                <button id="disconnect-button" class="secondary-button" type="button" hidden>Se déconnecter</button>
              </div>
              <p id="connection-status" class="connection-status" role="status" aria-live="polite" aria-atomic="true">Prêt à se connecter.</p>
            </form>
          </div>

          <div class="mascot-wrap" aria-hidden="true">
            <svg class="bomb-mascot" viewBox="0 0 520 500" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="263" cy="448" rx="160" ry="25" fill="#a7d5d1" />
              <path d="M170 386 Q153 414 139 415 Q128 416 124 405 Q124 395 141 382 L173 354Z" fill="#f47f6b" stroke="#253b49" stroke-width="10" stroke-linejoin="round" />
              <path d="M344 380 Q369 399 389 392 Q400 388 398 378 Q394 366 374 365 L337 350Z" fill="#f47f6b" stroke="#253b49" stroke-width="10" stroke-linejoin="round" />
              <path d="M268 117 C273 76 299 61 323 68" fill="none" stroke="#253b49" stroke-width="15" stroke-linecap="round" />
              <path d="M325 41 L337 62 L359 57 L350 78 L368 92 L345 93 L339 117 L325 98 L304 108 L309 85 L290 71 L313 67Z" fill="#ffd65a" stroke="#253b49" stroke-width="9" stroke-linejoin="round" />
              <rect x="227" y="111" width="77" height="50" rx="15" fill="#91aaa7" stroke="#253b49" stroke-width="10" />
              <circle cx="261" cy="278" r="151" fill="#253b49" />
              <circle cx="261" cy="267" r="141" fill="#3d5861" />
              <path d="M154 226 C176 156 235 143 260 151" fill="none" stroke="#718e91" stroke-width="24" stroke-linecap="round" />
              <ellipse cx="261" cy="302" rx="98" ry="79" fill="#fff9e9" stroke="#253b49" stroke-width="9" />
              <path d="M202 284 Q222 265 241 285" fill="none" stroke="#253b49" stroke-width="10" stroke-linecap="round" />
              <circle cx="306" cy="284" r="11" fill="#253b49" />
              <ellipse cx="193" cy="323" rx="15" ry="8" fill="#f47f6b" />
              <ellipse cx="331" cy="323" rx="15" ry="8" fill="#f47f6b" />
              <path d="M228 332 Q264 363 300 331" fill="none" stroke="#253b49" stroke-width="9" stroke-linecap="round" />
              <path d="M119 279 Q81 260 73 283 Q74 299 113 306" fill="#3d5861" stroke="#253b49" stroke-width="10" stroke-linejoin="round" />
              <path d="M404 279 Q443 255 453 279 Q456 294 410 305" fill="#3d5861" stroke="#253b49" stroke-width="10" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
